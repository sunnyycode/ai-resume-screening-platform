<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login & Register - SmartScreen AI</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 3rem auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: #f8fafc;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .auth-tab.active {
            background: var(--surface);
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .auth-body {
            padding: 2rem;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="nav-brand">
            <span>⚡</span> SmartScreen <span>AI</span>
        </a>
        <nav>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/job">Jobs</a></li>
                <li><a href="/candidates">Candidates</a></li>
                <li id="navAuth">
                    <a href="/login" class="btn btn-primary btn-sm">Login / Register</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">Create Account</button>
            </div>

            <div class="auth-body">
                <div id="authAlert"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Recruiter Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="recruiter@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="loginBtn">
                        Sign In
                    </button>
                </form>

                <!-- Register Form -->
                <form id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" class="form-control" placeholder="e.g. Alex Morgan" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Work Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="alex@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password (min 6 characters)</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="registerBtn">
                        Create Recruiter Account
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SmartScreen AI — AI-Powered Resume Screening & Job Matching Platform.</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const regForm = document.getElementById("registerForm");
            const tabLogin = document.getElementById("tabLoginBtn");
            const tabReg = document.getElementById("tabRegisterBtn");
            const alertBox = document.getElementById("authAlert");
            alertBox.innerHTML = "";

            if (tab === "login") {
                loginForm.style.display = "block";
                regForm.style.display = "none";
                tabLogin.classList.add("active");
                tabReg.classList.remove("active");
            } else {
                loginForm.style.display = "none";
                regForm.style.display = "block";
                tabReg.classList.add("active");
                tabLogin.classList.remove("active");
            }
        }

        // Handle Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const alertBox = document.getElementById("authAlert");
            const btn = document.getElementById("loginBtn");

            btn.disabled = true;
            btn.innerText = "Signing in...";
            alertBox.innerHTML = "";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    setToken(data.token);
                    setUser(data.user);
                    alertBox.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
                    setTimeout(() => { window.location.href = "/dashboard"; }, 800);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">Network error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        });

        // Handle Register
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const alertBox = document.getElementById("authAlert");
            const btn = document.getElementById("registerBtn");

            btn.disabled = true;
            btn.innerText = "Creating account...";
            alertBox.innerHTML = "";

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    setToken(data.token);
                    setUser(data.user);
                    alertBox.innerHTML = `<div class="alert alert-success">Account created! Redirecting to dashboard...</div>`;
                    setTimeout(() => { window.location.href = "/dashboard"; }, 800);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(data.error)}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">Network error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Create Recruiter Account";
            }
        });
    </script>
</body>
</html>
